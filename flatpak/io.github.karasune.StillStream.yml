id: io.github.karasune.StillStream
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: stillstream
separate-locales: false

finish-args:
  - --require-version=1.16.0
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  # Chromium finds gamepads through udev's device database; without it Xbox-style pads (and
  # Steam Input's virtual pad) stay invisible, as in other Flatpak Chromium browsers.
  - --filesystem=/run/udev:ro
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

modules:
  - name: stillstream
    buildsystem: simple
    build-commands:
      - cp -a app /app/stillstream
      - install -Dm755 stillstream.sh /app/bin/stillstream
      - install -Dm644 io.github.karasune.StillStream.desktop /app/share/applications/io.github.karasune.StillStream.desktop
      - install -Dm644 io.github.karasune.StillStream.metainfo.xml /app/share/metainfo/io.github.karasune.StillStream.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.karasune.StillStream.png
    sources:
      - type: dir
        path: ../dist/linux-unpacked
        dest: app
      - type: file
        path: stillstream.sh
      - type: file
        path: io.github.karasune.StillStream.desktop
      - type: file
        path: io.github.karasune.StillStream.metainfo.xml
      - type: file
        path: ../build/icon.png
        dest-filename: icon.png
